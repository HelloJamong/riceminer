name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 이미지 빌드 및 push (latest + 버전 태그)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/riceminer:latest
            ${{ secrets.DOCKER_USERNAME }}/riceminer:${{ github.ref_name }}

      - name: CHANGELOG에서 해당 버전 섹션 추출
        run: |
          awk '/^## \[${{ github.ref_name }}\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.md

      - name: 릴리즈 첨부 파일 준비 (GitHub는 .으로 시작하는 자산 파일명을 허용하지 않음)
        run: cp .env.example env.example

      - name: GitHub Release 생성
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            docker-compose.yml
            env.example
